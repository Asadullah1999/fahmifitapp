name: docvault
description: Privacy-first document scanner and secure vault app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.0.0

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Local Database
  hive_flutter: ^1.1.0

  # Secure Key Storage
  flutter_secure_storage: ^9.0.0

  # Biometric Auth
  local_auth: ^2.1.8

  # Camera & Scanning
  camera: ^0.10.5+9
  cunning_document_scanner: ^1.0.12

  # Image Processing
  image: ^4.1.7

  # PDF Generation & Viewing
  pdf: ^3.10.8
  printing: ^5.12.0
  syncfusion_flutter_pdfviewer: ^24.1.41

  # OCR
  google_mlkit_text_recognition: ^0.11.0

  # Encryption
  pointycastle: ^3.7.4
  convert: ^3.1.1
  crypto: ^3.0.3

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Monetization (RevenueCat)
  purchases_flutter: ^6.24.2

  # Utilities
  uuid: ^4.3.3
  path_provider: ^2.1.2
  path: ^1.9.0
  intl: ^0.19.0
  share_plus: ^7.2.2
  permission_handler: ^11.3.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  lottie: ^3.0.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
